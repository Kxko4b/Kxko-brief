name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Prepare permanent signing key
        id: signing
        env:
          KXKO_KEYSTORE_B64: ${{ secrets.KXKO_KEYSTORE_B64 }}
          KXKO_PW: ${{ secrets.KXKO_KEYSTORE_PASSWORD }}
        run: |
          echo "::notice title=Signing secrets::keystore chars=${#KXKO_KEYSTORE_B64} password chars=${#KXKO_PW}"
          if [ -n "$KXKO_KEYSTORE_B64" ]; then
            echo "$KXKO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kxko-release.jks"
            echo "KXKO_KEYSTORE_FILE=$RUNNER_TEMP/kxko-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key set: building with a temporary key (can't update over an installed app)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        env:
          KXKO_KEYSTORE_PASSWORD: ${{ secrets.KXKO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kxko-daily-briefing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release for in-app updates
        if: github.ref == 'refs/heads/master' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          cp app/build/outputs/apk/debug/*.apk kxko-daily-briefing.apk
          gh release create "v$CODE" kxko-daily-briefing.apk \
            --title "Kxko 2.3.$GITHUB_RUN_NUMBER" \
            --generate-notes \
            --latest
